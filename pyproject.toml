[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "car-price-prediction"
version = "0.2.0"
description = "Reproducible machine-learning pipeline for Audi used-car price prediction"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.2,<2.0",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.7,<4.0",
    "scipy>=1.10,<2.0",
    "catboost>=1.2,<2.0",
    "ydata-profiling>=4.0,<5.0",
    "jupyter>=1.0",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1.0",
    "black>=24,<27",
]
app = [
    "gradio>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
